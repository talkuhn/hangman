<link href="https://fonts.googleapis.com/css2?family=Gveret+Levin&family=Karantina:wght@400;700&family=Playpen+Sans+Hebrew:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --desk:#e6d9bf;
  --paper:#fffdf6;
  --line:#b7d5ee;
  --margin:#f28b8b;
  --pencil:#35353a;
  --pink:#ff4f8b;
  --blue:#2d7ff9;
  --green:#1fb56f;
  --orange:#ff9f1c;
  --yellow:#ffe45c;
  --purple:#8e5cf7;
  --m:44px;
  color-scheme:light;
  --wobble:255px 15px 225px 15px / 15px 225px 15px 255px;
  --wobble2:15px 225px 15px 255px / 255px 15px 225px 15px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
:root{direction:rtl}
html,body{margin:0}
html,body{height:100%}
body{
  background:
    radial-gradient(circle at 20% 10%, rgba(255,255,255,.35), transparent 40%),
    var(--desk);
  font-family:'Playpen Sans Hebrew','Gveret Levin','Comic Sans MS',cursive;
  color:var(--pencil);
  display:flex;justify-content:center;
  padding:14px 16px;direction:rtl;overflow:hidden;
}
.page{
  position:relative;
  width:min(760px,100%);
  height:100%;
  display:flex;flex-direction:column;
  padding:26px 16px 14px calc(var(--m) + 18px);
  padding-left:16px;
  padding-right:calc(var(--m) + 16px);
  background-color:var(--paper);
  background-image:
    linear-gradient(to left, transparent 0, transparent calc(var(--m) - 1px), var(--margin) calc(var(--m) - 1px), var(--margin) calc(var(--m) + 1px), transparent calc(var(--m) + 1px)),
    repeating-linear-gradient(to bottom, transparent 0, transparent 31px, var(--line) 31px, var(--line) 32px);
  background-position:0 0, 0 14px;
  border-radius:6px 14px 8px 12px;
  box-shadow:0 2px 0 #d9ceb5, 0 10px 24px rgba(70,50,10,.28), inset 0 0 40px rgba(220,200,150,.18);
  transform:rotate(-.25deg);
}
.hole{position:absolute;right:calc(var(--m) / 2 - 9px);width:18px;height:18px;border-radius:50%;background:var(--desk);box-shadow:inset 2px 3px 4px rgba(0,0,0,.35)}
.hole.h1{top:12%}.hole.h2{top:50%}.hole.h3{top:88%}
.tape{
  position:absolute;top:-14px;left:50%;width:120px;height:30px;margin-left:-60px;transform:rotate(-3deg);
  background:repeating-linear-gradient(45deg, rgba(255,160,190,.8) 0 10px, rgba(255,230,120,.8) 10px 20px);
  box-shadow:0 1px 3px rgba(0,0,0,.2);clip-path:polygon(0 8%,4% 0,8% 10%,12% 0,16% 8%,100% 0,100% 100%,0 100%);
  opacity:.9;
}
.doodle{position:absolute;pointer-events:none;filter:url(#pencil)}

h1,h2{margin:0;font-family:'Karantina','Gveret Levin',cursive;font-weight:700;line-height:1}
h1{font-size:clamp(4rem,16vw,6.6rem);text-align:center;letter-spacing:2px;padding-top:6px}
h1 span{display:inline-block;text-shadow:3px 3px 0 rgba(0,0,0,.14)}
h2{font-size:2.6rem;text-align:center;color:var(--blue)}
.sub{text-align:center;font-size:1.25rem;margin:4px 0 22px;font-weight:700}
.hl{background:linear-gradient(transparent 52%, var(--yellow) 52%, var(--yellow) 90%, transparent 90%);padding:0 8px}
.screen{animation:pop .35s ease-out;flex:1;min-height:0;display:flex;flex-direction:column;overflow-x:hidden;overflow-y:auto;padding:6px 8px 8px}
@keyframes pop{from{opacity:0;transform:translateY(8px) rotate(.5deg)}to{opacity:1;transform:none}}

.btn{
  font-family:'Gveret Levin','Playpen Sans Hebrew',cursive;
  font-size:1.35rem;color:var(--pencil);
  border:3px solid var(--pencil);border-radius:var(--wobble);
  padding:9px 22px;background:#fff;cursor:pointer;
  box-shadow:3px 4px 0 var(--pencil);
  transition:transform .12s, box-shadow .12s;
}
.btn:hover{transform:rotate(-1.5deg) scale(1.03)}
.btn:active{transform:translate(3px,4px);box-shadow:0 0 0 var(--pencil)}
.btn:focus-visible,.key:focus-visible,.chip:focus-visible,input:focus-visible,summary:focus-visible{outline:3px dashed var(--purple);outline-offset:3px}
.btn.pink{background:#ffc2d8}.btn.blue{background:#bcd9ff}.btn.green{background:#b8f0d4}.btn.yellow{background:var(--yellow)}.btn.orange{background:#ffd9a0}
.btn.big{font-size:1.8rem;padding:14px 30px}
.btn.small{font-size:1.05rem;padding:5px 14px;box-shadow:2px 3px 0 var(--pencil)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.stack{display:flex;flex-direction:column;align-items:center;gap:20px;margin:18px 0 26px}
.row{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;margin-top:16px}

.how{max-width:460px;margin:0 auto;background:#fff9c9;padding:10px 16px;border-radius:var(--wobble2);border:2.5px solid var(--pencil);transform:rotate(1deg);box-shadow:3px 4px 0 rgba(0,0,0,.18)}
.how summary{cursor:pointer;font-weight:700;font-size:1.1rem}
.how ol{margin:10px 0 4px;padding-inline-start:22px;line-height:1.7}

.chips{display:flex;flex-wrap:wrap;gap:14px;justify-content:center;margin:24px 0}
.chip{
  font-family:'Gveret Levin',cursive;font-size:1.4rem;color:var(--pencil);
  border:3px solid var(--pencil);border-radius:var(--wobble);padding:8px 18px;cursor:pointer;
  box-shadow:3px 3px 0 var(--pencil);transition:transform .12s;
}
.chip:nth-child(5n+1){background:#ffc2d8}.chip:nth-child(5n+2){background:#bcd9ff}.chip:nth-child(5n+3){background:#b8f0d4}.chip:nth-child(5n+4){background:#ffd9a0}.chip:nth-child(5n){background:#e0d0ff}
.chip:hover{transform:rotate(-2deg) scale(1.05)}

.field{display:flex;flex-direction:column;gap:4px;max-width:420px;margin:12px auto}
.field label{font-weight:700;font-size:1.05rem}
input[type=text],input[type=password]{
  font-family:'Gveret Levin','Playpen Sans Hebrew',cursive;font-size:1.5rem;color:var(--blue);
  padding:6px 12px;border:3px solid var(--pencil);border-radius:var(--wobble2);background:#fff;width:100%;
}
.checkline{display:flex;gap:8px;align-items:center;max-width:420px;margin:4px auto;font-size:1rem}
.err{color:var(--pink);font-weight:700;text-align:center;min-height:1.6em;margin:6px 0}
.note{text-align:center;font-size:1.05rem;margin:6px auto;max-width:460px}

/* game */
.topbar{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;align-items:center;margin-bottom:4px}
.sticky{
  background:#fff3a0;border:2px solid var(--pencil);padding:4px 14px;font-weight:700;font-size:1rem;
  border-radius:3px 12px 4px 10px;box-shadow:2px 3px 0 rgba(0,0,0,.2);transform:rotate(-1.2deg);
}
.sticky.b{background:#c9e4ff;transform:rotate(1.2deg)}
.sticky.p{background:#ffd0e1;transform:rotate(-.6deg)}
.sticky.g{background:#c6f3dc}
.scoreboard{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.hang{position:relative;min-height:110px;margin:0}
.hang svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.hang svg .scene{filter:url(#pencil)}
.part{fill:none;stroke:var(--pencil);stroke-width:5;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:1;stroke-dashoffset:1;transition:stroke-dashoffset .6s ease}
.part.on{stroke-dashoffset:0}
.part.thin{stroke-width:3.5}
.grass{fill:none;stroke:var(--green);stroke-width:3;stroke-linecap:round}
.face{fill:none;stroke:var(--pencil);stroke-width:3.5;stroke-linecap:round}
.face .dot{fill:var(--pencil);stroke:none}
svg.lost .part.fig{stroke:var(--pink)}
svg.lost .face{stroke:var(--pink)}
svg.win .figure{animation:dance 1s ease-in-out infinite;transform-origin:205px 72px}
svg.lost .figure{animation:sway 2.4s ease-in-out infinite;transform-origin:205px 36px}
@keyframes dance{0%,100%{transform:rotate(-5deg)}50%{transform:rotate(5deg)}}
@keyframes sway{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg)}}

.word{display:flex;flex-wrap:wrap;gap:8px 6px;justify-content:center;margin:4px 0 10px;direction:rtl}
.slot{
  width:clamp(30px,8.4vw,46px);height:clamp(46px,11vw,62px);
  border-bottom:5px solid var(--pencil);border-radius:2px 10px 2px 8px;
  font-family:'Gveret Levin',cursive;font-size:clamp(2rem,8.4vw,3rem);line-height:1.15;text-align:center;color:var(--blue);
}
.slot.gap{border-bottom-color:transparent;width:20px}
.slot.pop{animation:letterpop .4s cubic-bezier(.3,1.8,.5,1)}
.slot.miss{color:var(--pink)}
@keyframes letterpop{from{transform:scale(.2) rotate(-25deg)}to{transform:none}}
.kb{display:flex;flex-direction:column;gap:6px;align-items:center;margin-bottom:8px}
.kbrow{display:flex;gap:4px;justify-content:center}
.key{
  font-family:'Gveret Levin',cursive;font-size:clamp(1.15rem,5.6vw,1.65rem);color:var(--pencil);
  width:clamp(28px,9vw,50px);height:clamp(38px,11vw,54px);padding:0;
  border:2.5px solid var(--pencil);border-radius:var(--wobble);background:#fff;box-shadow:2px 3px 0 var(--pencil);cursor:pointer;
  transition:transform .1s;
}
.key:hover:not(:disabled){transform:rotate(-3deg) translateY(-2px)}
.key:active:not(:disabled){transform:translate(2px,3px);box-shadow:none}
.key.ok{background:#b8f0d4;border-color:var(--green);box-shadow:2px 3px 0 var(--green)}
.key.no{background:#ffd3de;border-color:var(--pink);box-shadow:none;position:relative;opacity:.65}
.key.no::after{content:"";position:absolute;left:-2px;right:-2px;top:50%;border-top:3px solid var(--pink);transform:rotate(-24deg)}
.key:disabled{cursor:default}

.modal{position:fixed;inset:0;background:rgba(40,30,10,.45);display:flex;align-items:center;justify-content:center;padding:16px;z-index:50}
.card{
  width:min(440px,100%);text-align:center;padding:26px 22px 24px;
  background:var(--paper);border:3px solid var(--pencil);border-radius:var(--wobble);
  box-shadow:6px 8px 0 rgba(0,0,0,.3);animation:cardin .45s cubic-bezier(.3,1.5,.5,1);
  background-image:repeating-linear-gradient(to bottom, transparent 0, transparent 31px, var(--line) 31px, var(--line) 32px);
}
@keyframes cardin{from{transform:scale(.5) rotate(-8deg);opacity:0}to{transform:none;opacity:1}}
.card h2{font-size:3.4rem}
.card.lose h2{color:var(--pink)}
.card.win h2{color:var(--green)}
.card .revealed{font-family:'Gveret Levin',cursive;font-size:2.2rem;color:var(--blue);margin:6px 0 4px;word-break:break-word}
.card p{margin:6px 0}
.pieces{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:60}
.piece{position:absolute;top:-40px;font-family:'Gveret Levin',cursive;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(var(--r))}}
.foot{text-align:center;margin-top:28px;font-size:.95rem;opacity:.75}

@media (max-width:520px){
  :root{--m:30px}
  body{padding:8px 16px 28px}
  .page{padding:24px 10px 12px;padding-right:calc(var(--m) + 10px);transform:none}
  .hole{width:14px;height:14px;right:8px}
  .doodle.hide-m{display:none}
}
.center::before,.center::after{content:"";flex:1 0 0}
#s-game>*{flex:none}
#s-game>.hang{flex:1 1 0}
#s-game .row{margin-top:6px}
.soundbtn{position:absolute;top:10px;left:10px;z-index:5;width:42px;height:42px;padding:0;display:grid;place-items:center;color:var(--pencil);background:#fff;border:2.5px solid var(--pencil);border-radius:var(--wobble);box-shadow:2px 3px 0 var(--pencil);cursor:pointer;transition:transform .12s}
.soundbtn:hover{transform:rotate(-6deg) scale(1.06)}
.soundbtn:active{transform:translate(2px,3px);box-shadow:none}
.soundbtn:focus-visible{outline:3px dashed var(--purple);outline-offset:3px}
.soundbtn svg{fill:none;stroke:currentColor;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.soundbtn .sp{fill:var(--yellow)}
.soundbtn .slash{display:none;stroke:var(--pink);stroke-width:3}
.soundbtn[aria-pressed="false"] .wave{display:none}
.soundbtn[aria-pressed="false"] .slash{display:inline}
@media (max-width:520px){.soundbtn{width:36px;height:36px;top:8px;left:8px}}
@media (max-height:640px){
  .key{height:34px}
  h1{font-size:clamp(3rem,13vw,5rem)}
  .hang{min-height:80px}
  .slot{height:44px;font-size:2rem}
}
/* iPad: portrait and landscape */
.btn,.key,.chip,.soundbtn{touch-action:manipulation;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
@media (min-width:700px) and (min-height:600px){
  :root{--m:56px}
  body{padding-block:20px}
  .page{width:min(900px,100%);padding:34px 28px 22px 28px;padding-right:calc(var(--m) + 24px)}
  .hole{width:22px;height:22px;right:calc(var(--m) / 2 - 11px)}
  .btn{font-size:1.6rem;padding:12px 28px}
  .btn.big{font-size:2.2rem;padding:18px 40px}
  .btn.small{font-size:1.3rem;padding:8px 18px}
  .chip{font-size:1.8rem;padding:12px 26px}
  h1{font-size:clamp(6rem,14vw,9rem)}
  h2{font-size:3.4rem}
  .sub{font-size:1.6rem}
  .sticky{font-size:1.2rem;padding:6px 18px}
  .field{max-width:520px}
  .field label{font-size:1.25rem}
  .note,.err{font-size:1.25rem}
  input[type=text],input[type=password]{font-size:1.8rem;padding:10px 16px}
  .slot{width:clamp(44px,6vw,64px);height:clamp(64px,8vw,86px);font-size:clamp(2.8rem,5vw,4rem)}
  .kb{width:100%;gap:10px}
  .kbrow{width:100%;gap:8px}
  .key{flex:0 0 calc((100% - 64px) / 9);width:auto;max-width:72px;height:66px;font-size:2.1rem}
  .card{width:min(560px,100%)}
  .card h2{font-size:4rem}
  .card .revealed{font-size:2.8rem}
  .soundbtn{width:52px;height:52px;top:14px;left:14px}
}
@media (min-width:900px) and (min-height:600px) and (orientation:landscape){
  .page{width:min(1180px,100%)}
  .doodle{display:none}
  #s-game{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);grid-template-rows:auto auto 1fr auto auto 1fr;column-gap:32px}
  #s-game>*{min-width:0}
  #score{grid-column:1 / -1;grid-row:1}
  #s-game>.topbar{grid-column:1 / -1;grid-row:2}
  #s-game>.hang{grid-column:1;grid-row:3 / 7;min-height:0}
  #s-game>.word{grid-column:2;grid-row:3;align-self:end}
  #s-game>.kb{grid-column:2;grid-row:4}
  #s-game>.row{grid-column:2;grid-row:5}
  .kbrow{gap:6px}
  .key{flex-basis:calc((100% - 48px) / 9);height:clamp(48px,7.5vh,62px);font-size:1.9rem}
}
@media (hover:none){
  .btn:hover,.chip:hover,.soundbtn:hover,.key:hover:not(:disabled){transform:none}
}
@media (prefers-reduced-motion:reduce){
  *{animation:none!important;transition:none!important}
}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
  <filter id="pencil" x="-5%" y="-5%" width="110%" height="110%">
    <feTurbulence type="fractalNoise" baseFrequency="0.035" numOctaves="2" seed="4" result="n"/>
    <feDisplacementMap in="SourceGraphic" in2="n" scale="3.5"/>
  </filter>
</svg>

<main class="page" id="page">
  <div class="tape"></div>
  <button class="soundbtn" id="soundBtn" type="button" aria-pressed="true" aria-label="כבה צלילים">
    <svg viewBox="0 0 32 32" width="26" height="26" aria-hidden="true"><path class="sp" d="M5 12 h5 l7 -6 v20 l-7 -6 h-5 z"/><path class="wave" d="M21 11 q4 5 0 10 M24 7 q7 9 0 18"/><path class="slash" d="M4 4 L28 28"/></svg>
  </button>
  <span class="hole h1"></span><span class="hole h2"></span><span class="hole h3"></span>

  <!-- דודלס קישוטיים -->
  <svg class="doodle hide-m" style="top:70px;left:14px" width="64" height="64" viewBox="0 0 64 64" aria-hidden="true">
    <path d="M32 5 L39 24 L59 25 L43 37 L49 57 L32 45 L15 57 L21 37 L5 25 L25 24 Z" fill="#ffe45c" stroke="#35353a" stroke-width="3" stroke-linejoin="round"/>
  </svg>
  <svg class="doodle hide-m" style="top:360px;left:10px" width="70" height="40" viewBox="0 0 70 40" aria-hidden="true">
    <path d="M4 20 Q14 2 24 20 T44 20 T64 20" fill="none" stroke="#ff4f8b" stroke-width="5" stroke-linecap="round"/>
  </svg>

  <!-- מסך ראשי -->
  <section id="s-menu" class="screen center">
    <h1 id="title" aria-label="איש תלוי">איש תלוי</h1>
    <p class="sub"><span class="hl">משחק ניחוש מילים</span></p>
    <div class="stack">
      <button class="btn pink big" data-go="cat">✏️ שחקן אחד</button>
      <button class="btn blue big" data-go="names">👯 שני שחקנים</button>
    </div>
  </section>

  <!-- בחירת קטגוריה -->
  <section id="s-cat" class="screen center" hidden>
    <h2>על מה נשחק?</h2>
    <div class="chips" id="chips"></div>
    <div class="row"><button class="btn small" data-go="menu">⬅ חזרה</button></div>
  </section>

  <!-- שמות שחקנים -->
  <section id="s-names" class="screen center" hidden>
    <h2>מי משחק?</h2>
    <div class="field"><label for="n1">שחקן א׳</label><input type="text" id="n1" maxlength="12" placeholder="שחקן א׳" autocomplete="off"></div>
    <div class="field"><label for="n2">שחקן ב׳</label><input type="text" id="n2" maxlength="12" placeholder="שחקן ב׳" autocomplete="off"></div>
    <div class="row">
      <button class="btn green big" id="namesGo">קדימה! ✏️</button>
    </div>
    <div class="row"><button class="btn small" data-go="menu">⬅ חזרה</button></div>
  </section>

  <!-- הכנת מילה (שני שחקנים) -->
  <section id="s-set" class="screen center" hidden>
    <h2 id="setTitle">מכינים מילה</h2>
    <p class="note" id="setNote"></p>
    <div class="field">
      <label for="secret">המילה הסודית (באותיות עבריות)</label>
      <input type="text" id="secret" maxlength="24" autocomplete="off" autocapitalize="off" spellcheck="false">
    </div>
    <div class="field">
      <label for="hint">רמז למנחש (לא חובה)</label>
      <input type="text" id="hint" maxlength="30" autocomplete="off" placeholder="למשל: חיה, אוכל, מקום...">
    </div>
    <div class="err" id="setErr" role="alert"></div>
    <div class="row">
      <button class="btn green big" id="setGo">מוכן, מעבירים! 👉</button>
    </div>
    <div class="row"><button class="btn small" data-go="menu">⬅ לתפריט</button></div>
  </section>

  <!-- המשחק -->
  <section id="s-game" class="screen" hidden>
    <div class="scoreboard" id="score" hidden></div>
    <div class="topbar">
      <span class="sticky b" id="roles" hidden></span>
      <span class="sticky" id="catpill"></span>
    </div>

    <div class="hang">
      <svg id="svg" viewBox="0 0 300 330" role="img" aria-label="איור איש תלוי">
        <g class="scene">
          <path class="grass" d="M20 316 l4 -10 M32 318 l2 -12 M250 318 l3 -11 M268 316 l5 -9 M262 320 l1 -12"/>
          <path class="part thin g" pathLength="1" d="M30 312 Q150 302 275 314"/>
          <path class="part g" pathLength="1" d="M80 310 Q76 160 82 30"/>
          <path class="part g" pathLength="1" d="M70 34 Q150 27 215 37"/>
          <path class="part thin g" pathLength="1" d="M82 92 Q110 62 136 36"/>
          <path class="part thin g" pathLength="1" d="M205 36 Q207 55 205 72"/>
          <g class="figure">
            <path class="part fig" id="p1" pathLength="1" d="M205 72 C226 70 237 90 232 105 C228 125 205 131 190 120 C175 108 178 80 205 72"/>
            <path class="part fig" id="p2" pathLength="1" d="M205 130 Q208 170 204 212"/>
            <path class="part fig" id="p3" pathLength="1" d="M205 145 Q185 156 167 180"/>
            <path class="part fig" id="p4" pathLength="1" d="M205 145 Q226 156 243 178"/>
            <path class="part fig" id="p5" pathLength="1" d="M204 212 Q190 237 174 264"/>
            <path class="part fig" id="p6" pathLength="1" d="M204 212 Q221 237 237 262"/>
            <path class="part fig" id="p9" pathLength="1" d="M174 264 L157 271"/>
            <path class="part fig" id="p10" pathLength="1" d="M237 262 L254 269"/>
            <g class="face" id="face" hidden>
              <g id="eyesN"><circle class="dot" cx="195" cy="96" r="3.5"/><circle class="dot" cx="215" cy="96" r="3.5"/></g>
              <g id="eyesX" hidden><path d="M190 91 l10 10 M200 91 l-10 10 M210 91 l10 10 M220 91 l-10 10"/></g>
              <path id="mN" d="M196 113 Q205 114 214 113"/>
              <path id="mS" d="M196 117 Q205 107 214 117" hidden/>
              <path id="mH" d="M193 108 Q205 124 217 108" hidden/>
            </g>
          </g>
        </g>
      </svg>
    </div>

    <div class="word" id="word" aria-live="polite"></div>
    <div class="kb" id="kb"></div>
    <div class="row">
      <button class="btn yellow small" id="hintBtn">💡 רמז (עולה בטעות)</button>
      <button class="btn blue small" id="newBtn">🔄 מילה חדשה</button>
      <button class="btn small" data-go="menu">🏠 תפריט</button>
    </div>
  </section>
</main>

<div class="modal" id="modal" hidden>
  <div class="card" id="card">
    <h2 id="mTitle"></h2>
    <p id="mMsg"></p>
    <div class="revealed" id="mWord"></div>
    <div class="row">
      <button class="btn green" id="mNext">עוד סיבוב</button>
      <button class="btn small" id="mMenu">תפריט</button>
    </div>
  </div>
</div>
<div class="pieces" id="pieces" aria-hidden="true"></div>

<script>
(() => {
  'use strict';
  document.documentElement.lang = 'he';
  document.documentElement.dir = 'rtl';
  const $ = s => document.querySelector(s);
  const $$ = s => [...document.querySelectorAll(s)];

  const MAX_WRONG = 10;
  const FINALS = {'ך':'כ','ם':'מ','ן':'נ','ף':'פ','ץ':'צ'};
  const norm = c => FINALS[c] || c;
  const ROWS = ['אבגדהוזח', 'טיכלמנס', 'עפצקרשת'];
  const COLORS = ['#ff4f8b','#2d7ff9','#1fb56f','#ff9f1c','#8e5cf7','#e8433a'];

  /* ---------- צלילים ---------- */
  const sfx = (() => {
    let ctx = null, on = true, noiseBuf = null;
    try { on = localStorage.getItem('hangman-sound') !== 'off'; } catch(e){}
    function ac(){
      if(!on) return null;
      if(!ctx){
        const C = window.AudioContext || window.webkitAudioContext;
        if(!C) return null;
        try { ctx = new C(); } catch(e){ return null; }
      }
      if(ctx.state === 'suspended') ctx.resume().catch(() => {});
      return ctx;
    }
    function tone(freq, at, dur, type, vol, slideTo){
      const c = ac(); if(!c) return;
      const t = c.currentTime + at;
      const o = c.createOscillator(), g = c.createGain();
      o.type = type || 'sine';
      o.frequency.setValueAtTime(freq, t);
      if(slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, t + dur);
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(vol || .15, t + .012);
      g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      o.connect(g); g.connect(c.destination);
      o.start(t); o.stop(t + dur + .03);
    }
    function scribble(at, dur, vol){
      const c = ac(); if(!c) return;
      if(!noiseBuf){
        noiseBuf = c.createBuffer(1, c.sampleRate, c.sampleRate);
        const d = noiseBuf.getChannelData(0);
        for(let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
      }
      const t = c.currentTime + at;
      const src = c.createBufferSource(); src.buffer = noiseBuf; src.loop = true;
      const f = c.createBiquadFilter(); f.type = 'bandpass'; f.Q.value = 1.2;
      f.frequency.setValueAtTime(1800, t);
      f.frequency.linearRampToValueAtTime(4200, t + dur * .5);
      f.frequency.linearRampToValueAtTime(2200, t + dur);
      const g = c.createGain();
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(vol, t + .02);
      g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      src.connect(f); f.connect(g); g.connect(c.destination);
      src.start(t); src.stop(t + dur + .03);
    }
    return {
      isOn: () => on,
      toggle(){ on = !on; try { localStorage.setItem('hangman-sound', on ? 'on' : 'off'); } catch(e){} },
      click(){ tone(540, 0, .06, 'triangle', .09, 380); },
      good(){ tone(660, 0, .11, 'sine', .16); tone(990, .08, .2, 'sine', .14); },
      bad(){ scribble(0, .28, .22); tone(190, 0, .3, 'square', .07, 85); },
      win(){ [523, 659, 784, 1047, 1319].forEach((f, i) => tone(f, i * .11, .26, 'triangle', .16)); },
      lose(){ [392, 349, 311, 233].forEach((f, i) => tone(f, i * .26, .34, 'sawtooth', .07, f * .94)); }
    };
  })();
  const soundBtn = $('#soundBtn');
  function syncSound(){
    soundBtn.setAttribute('aria-pressed', String(sfx.isOn()));
    soundBtn.setAttribute('aria-label', sfx.isOn() ? 'כבה צלילים' : 'הפעל צלילים');
  }
  soundBtn.addEventListener('click', () => { sfx.toggle(); syncSound(); if(sfx.isOn()) sfx.click(); });
  syncSound();

  const CATEGORIES = [
    {name:'חיות', emoji:'🐾', words:['ג׳ירפה','פיל','דולפין','ינשוף','צב','קנגורו','נחש','ארנב','תנין','פינגווין','חתול','כלב','עכבר','זברה','תן','יענה','קוף','חמור','סנאי','דבורה']},
    {name:'אוכל', emoji:'🍕', words:['פיצה','שוקולד','המבורגר','פלאפל','חומוס','שניצל','פסטה','אבטיח','גלידה','עוגה','סלט','לביבות','מלפפון','בננה','תפוח','סופגניה','שקשוקה','פופקורן','אורז','חלה']},
    {name:'ארצות', emoji:'🌍', words:['ישראל','צרפת','איטליה','יפן','ברזיל','מצרים','אוסטרליה','קנדה','ספרד','הודו','סין','גרמניה','יוון','תאילנד','מקסיקו','פורטוגל','הולנד','נורווגיה','קניה','ארגנטינה']},
    {name:'מקצועות', emoji:'👩‍🚀', words:['רופא','מורה','טבח','נהג','כבאי','שוטר','אסטרונאוט','צייר','זמר','טייס','נגר','חייט','מהנדס','עיתונאי','שחקן','ספר','מתכנת','אפרן','דייג','חקלאי']},
    {name:'בבית', emoji:'🏠', words:['מקרר','כיסא','שולחן','מנורה','מיטה','שטיח','ספה','מראה','וילון','תנור','מטאטא','כרית','שעון','מחשב','טלוויזיה','מקלחת','דלת','חלון','מברשת','סיר']},
    {name:'טבע', emoji:'🌳', words:['הר','נהר','שמש','ירח','כוכב','עץ','פרח','גשם','ים','מדבר','יער','שלג','קשת','עננים','סערה','אגם','מפל','חול','סלע','רוח']}
  ];

  const state = {
    mode:'1', cat:null, bag:[],
    word:'', hint:'', catLabel:'',
    guessed:new Set(), wrong:0, over:false,
    players:[{name:'שחקן א׳',score:0},{name:'שחקן ב׳',score:0}], setter:0
  };

  /* ---------- ניווט ---------- */
  function show(id){
    $$('.screen').forEach(s => s.hidden = s.id !== 's-' + id);
    $('#modal').hidden = true;
    window.scrollTo({top:0});
  }
  document.addEventListener('click', e => {
    if(e.target.closest('.btn,.chip')) sfx.click();
    const b = e.target.closest('[data-go]');
    if(!b) return;
    const to = b.dataset.go;
    if(to === 'cat'){ state.mode = '1'; buildChips(); }
    if(to === 'names'){ state.mode = '2'; }
    show(to);
  });

  /* ---------- כותרת צבעונית ---------- */
  (function(){
    const t = $('#title'), txt = t.textContent; t.textContent = '';
    let i = 0;
    [...txt].forEach(ch => {
      const s = document.createElement('span');
      s.textContent = ch === ' ' ? '\u00A0' : ch;
      s.style.color = COLORS[i % COLORS.length];
      s.style.transform = `rotate(${(i % 2 ? 1 : -1) * (2 + (i * 3) % 5)}deg) translateY(${(i % 3) * 2 - 2}px)`;
      t.appendChild(s); i++;
    });
  })();

  /* ---------- שחקן אחד ---------- */
  function buildChips(){
    const box = $('#chips'); box.textContent = '';
    CATEGORIES.forEach((c, i) => box.appendChild(chip(`${c.emoji} ${c.name}`, () => { state.cat = i; nextSolo(); })));
    box.appendChild(chip('🎲 הפתעה', () => { state.cat = -1; nextSolo(); }));
  }
  function chip(label, fn){
    const b = document.createElement('button');
    b.className = 'chip'; b.textContent = label; b.addEventListener('click', fn); return b;
  }
  function pickWord(){
    const idx = state.cat === -1 ? Math.floor(Math.random() * CATEGORIES.length) : state.cat;
    const c = CATEGORIES[idx];
    state.bag = state.bag.filter(x => x.c === idx);
    if(!state.bag.length) state.bag = shuffle(c.words.slice()).map(w => ({c:idx, w}));
    return {word: state.bag.pop().w, label: `${c.emoji} ${c.name}`};
  }
  function nextSolo(){
    const p = pickWord();
    startRound(p.word, '', p.label);
  }
  function shuffle(a){ for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; }

  /* ---------- שני שחקנים ---------- */
  $('#namesGo').addEventListener('click', () => {
    state.players[0].name = $('#n1').value.trim() || 'שחקן א׳';
    state.players[1].name = $('#n2').value.trim() || 'שחקן ב׳';
    state.players[0].score = state.players[1].score = 0;
    state.setter = 0;
    showSet();
  });
  function showSet(){
    const s = state.players[state.setter], g = state.players[1 - state.setter];
    $('#setTitle').textContent = `${s.name}, ממציאים מילה`;
    $('#setNote').textContent = `${g.name}, תסתכל/י הצידה! 🙈`;
    $('#secret').value = ''; $('#hint').value = ''; $('#setErr').textContent = '';
    
    show('set');
  }
  function submitWord(){
    const w = $('#secret').value.trim().replace(/\s+/g, ' ');
    const letters = w.replace(/ /g, '');
    if(!/^[א-ת]+( [א-ת]+)*$/.test(w)){ $('#setErr').textContent = 'רק אותיות בעברית ורווחים, בבקשה ✏️'; return; }
    if(letters.length < 2){ $('#setErr').textContent = 'המילה קצרה מדי, לפחות 2 אותיות.'; return; }
    startRound(w, $('#hint').value.trim(), '');
  }
  $('#setGo').addEventListener('click', submitWord);
  $('#secret').addEventListener('keydown', e => { if(e.key === 'Enter') submitWord(); });
  $('#hint').addEventListener('keydown', e => { if(e.key === 'Enter') submitWord(); });

  /* ---------- סיבוב ---------- */
  function startRound(word, hint, catLabel){
    Object.assign(state, {word, hint, catLabel, guessed:new Set(), wrong:0, over:false});
    const two = state.mode === '2';
    const pill = $('#catpill');
    if(two){ pill.textContent = hint ? `💡 רמז: ${hint}` : 'בלי רמז'; }
    else { pill.textContent = catLabel; }
    pill.hidden = false;
    $('#roles').hidden = !two;
    $('#hintBtn').hidden = two;
    $('#newBtn').hidden = two;
    $('#score').hidden = !two;
    if(two){
      const s = state.players[state.setter], g = state.players[1 - state.setter];
      $('#roles').textContent = `✏️ ${s.name} ממציא/ה · 🤔 ${g.name} מנחש/ת`;
      renderScore();
    }
    buildKeyboard();
    resetHangman();
    render();
    show('game');
  }
  function renderScore(){
    const box = $('#score'); box.textContent = '';
    state.players.forEach((p, i) => {
      const s = document.createElement('span');
      s.className = 'sticky ' + (i ? 'p' : 'g');
      s.textContent = `${p.name}: ${p.score}`;
      box.appendChild(s);
    });
  }
  function buildKeyboard(){
    const kb = $('#kb'); kb.textContent = '';
    ROWS.forEach(r => {
      const row = document.createElement('div'); row.className = 'kbrow';
      [...r].forEach(ch => {
        const k = document.createElement('button');
        k.className = 'key'; k.textContent = ch; k.dataset.l = ch; k.setAttribute('aria-label', 'האות ' + ch);
        k.addEventListener('click', () => guess(ch));
        row.appendChild(k);
      });
      kb.appendChild(row);
    });
  }
  function render(newLetter){
    const box = $('#word'); box.textContent = '';
    [...state.word].forEach(ch => {
      const s = document.createElement('span');
      s.className = 'slot';
      if(ch === ' '){ s.classList.add('gap'); }
      else if(state.guessed.has(norm(ch))){
        s.textContent = ch;
        if(newLetter && norm(ch) === newLetter) s.classList.add('pop');
      } else if(state.over && state.wrong >= MAX_WRONG){
        s.textContent = ch; s.classList.add('miss');
      }
      box.appendChild(s);
    });
    $('#hintBtn').disabled = state.over || state.wrong >= MAX_WRONG - 1;
  }
  function isWon(){
    return [...state.word].every(ch => ch === ' ' || state.guessed.has(norm(ch)));
  }
  function guess(letter){
    if(state.over || state.guessed.has(letter)) return;
    state.guessed.add(letter);
    const hit = [...state.word].some(ch => norm(ch) === letter);
    const key = $(`.key[data-l="${letter}"]`);
    if(key){ key.disabled = true; key.classList.add(hit ? 'ok' : 'no'); }
    if(!hit) state.wrong++;
    if(hit) sfx.good(); else sfx.bad();
    afterMove(hit ? letter : null);
  }
  function afterMove(newLetter){
    if(isWon()) state.over = true;
    else if(state.wrong >= MAX_WRONG) state.over = true;
    updateHangman();
    render(newLetter);
    if(state.over){
      $$('.key').forEach(k => k.disabled = true);
      setTimeout(finish, 900);
    }
  }
  $('#hintBtn').addEventListener('click', () => {
    if(state.over || state.wrong >= MAX_WRONG - 1) return;
    const pool = [...new Set([...state.word].filter(c => c !== ' ').map(norm))].filter(l => !state.guessed.has(l));
    if(!pool.length) return;
    const l = pool[Math.floor(Math.random() * pool.length)];
    state.guessed.add(l); state.wrong++; sfx.good();
    const key = $(`.key[data-l="${l}"]`);
    if(key){ key.disabled = true; key.classList.add('ok'); }
    afterMove(l);
  });
  $('#newBtn').addEventListener('click', () => nextSolo());

  /* מקלדת פיזית */
  document.addEventListener('keydown', e => {
    if($('#s-game').hidden || !$('#modal').hidden) return;
    if(e.ctrlKey || e.metaKey || e.altKey) return;
    if(/^[א-ת]$/.test(e.key)) guess(norm(e.key));
  });

  /* ---------- איש תלוי ---------- */
  let timers = [];
  function resetHangman(){
    timers.forEach(clearTimeout); timers = [];
    const svg = $('#svg'); svg.classList.remove('win', 'lost');
    $$('#svg .part').forEach(p => p.classList.remove('on'));
    vis($('#face'), false);
    setMood('N');
    $$('#svg .part.g').forEach((p, i) => timers.push(setTimeout(() => p.classList.add('on'), 80 + i * 130)));
  }
  function vis(el, show){ el.toggleAttribute('hidden', !show); }
  function setMood(m){
    vis($('#mN'), m === 'N'); vis($('#mS'), m === 'S' || m === 'X'); vis($('#mH'), m === 'H');
    vis($('#eyesN'), m !== 'X'); vis($('#eyesX'), m === 'X');
  }
  function updateHangman(){
    for(let i = 1; i <= MAX_WRONG; i++){ const el = $('#p' + i); if(el) el.classList.toggle('on', state.wrong >= i); }
    const svg = $('#svg');
    if(state.over && isWon()){ svg.classList.add('win'); setMood('H'); }
    else if(state.over){ svg.classList.add('lost'); setMood('X'); }
    else setMood(state.wrong >= 9 ? 'S' : 'N');
    // mistake 7 draws the eyes, mistake 8 the mouth; a finished round always shows the face
    const showEyes = state.over || state.wrong >= 7, showMouth = state.over || state.wrong >= 8;
    vis($('#face'), showEyes || showMouth);
    if(!showEyes){ vis($('#eyesN'), false); vis($('#eyesX'), false); }
    if(!showMouth){ vis($('#mN'), false); vis($('#mS'), false); vis($('#mH'), false); }
  }

  /* ---------- סיום סיבוב ---------- */
  function finish(){
    const won = isWon();
    const two = state.mode === '2';
    const card = $('#card');
    card.className = 'card ' + (won ? 'win' : 'lose');
    $('#mTitle').textContent = won ? 'כל הכבוד! 🎉' : 'אוי לא! 😵';
    $('#mWord').textContent = state.word;
    if(two){
      const s = state.players[state.setter], g = state.players[1 - state.setter];
      const winner = won ? g : s;
      winner.score++;
      renderScore();
      $('#mMsg').textContent = (won ? `${g.name} פיצח/ה את המילה! ` : `האיש נתלה, והמילה הייתה: `) + `נקודה ל${winner.name}.`;
      if(won) $('#mMsg').textContent = `${g.name} פיצח/ה את המילה! נקודה ל${winner.name}.`;
      $('#mNext').textContent = 'סיבוב הבא (מחליפים תפקידים)';
    } else {
      $('#mMsg').textContent = won ? 'ניחשת את המילה:' : 'המילה הייתה:';
      $('#mNext').textContent = 'עוד מילה ✏️';
    }
    $('#modal').hidden = false;
    if(won){ confetti(); sfx.win(); } else sfx.lose();
  }
  $('#mNext').addEventListener('click', () => {
    $('#modal').hidden = true;
    if(state.mode === '2'){ state.setter = 1 - state.setter; showSet(); }
    else nextSolo();
  });
  $('#mMenu').addEventListener('click', () => show('menu'));

  /* ---------- קונפטי מצויר ---------- */
  function confetti(){
    const box = $('#pieces'); const chars = ['★','✦','♥','✿','~','✺','☺'];
    for(let i = 0; i < 46; i++){
      const p = document.createElement('span');
      p.className = 'piece';
      p.textContent = chars[Math.floor(Math.random() * chars.length)];
      p.style.left = Math.random() * 100 + 'vw';
      p.style.fontSize = 20 + Math.random() * 28 + 'px';
      p.style.color = COLORS[Math.floor(Math.random() * COLORS.length)];
      p.style.setProperty('--r', (Math.random() * 720 - 360) + 'deg');
      p.style.animationDuration = 2.4 + Math.random() * 2.2 + 's';
      p.style.animationDelay = Math.random() * .6 + 's';
      box.appendChild(p);
    }
    setTimeout(() => { box.textContent = ''; }, 5500);
  }
})();
</script>

</body>
</html>
